<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px system-ui, sans-serif;
        width: 280px;
        margin: 12px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      select,
      button {
        width: 100%;
        font: inherit;
        padding: 6px;
        box-sizing: border-box;
      }
      button {
        margin-top: 10px;
        cursor: pointer;
      }
      button.armed {
        background: #b00020;
        color: #fff;
        border-color: #b00020;
      }
      #status {
        margin-top: 8px;
        min-height: 1em;
        color: #555;
      }
      #status.error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <label for="folder">Bookmarks folder</label>
    <select id="folder"></select>
    <button id="go">Clear &amp; re-pin tabs</button>
    <button id="goAll">Close all &amp; re-pin tabs</button>
    <div id="status"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
